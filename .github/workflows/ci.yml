# =============================================================================
# Senpy CI — тесты и линтинг на каждый push и PR
# =============================================================================
# Триггеры:
#   - push в main или develop
#   - pull request в main или develop
#   - push в любую feature/* или refactor/* ветку (только быстрые тесты)
#
# Что делает:
#   1. Matrix-тесты: Python 3.11/3.12/3.13 × Ubuntu/Windows + macOS (3.12)
#   2. Pytest с coverage (gate: --cov-fail-under=75)
#
# НЕ делает:
#   - Сборку wheel/VSIX (это в release.yml)
#   - Публикацию на PyPI (это в release.yml)
#   - Создание GitHub Release (это в release.yml)
#
# Что делает (lint job, CI-1):
#   - Ruff check (blocking) — style-нарушения падают CI
#   - Ruff format --check (blocking) — неправильное форматирование падает CI
#   - mypy (non-blocking, warn-only) — сообщения о типах, не блокирует PR
# =============================================================================
name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'refactor/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - develop

# Отменяем старые запуски той же ветки при новом push — экономит минуты CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 0. Быстрая проверка циклических импортов (Ubuntu только, Python 3.12)
  # ===========================================================================
  # Фаза 1.7 (0.5.3): safety net для архитектуры. Если кто-то случайно
  # создаст новый цикл (analyzer ↔ X) — этот job упадёт ДО matrix-тестов.
  # Запускается первым, ~5 секунд.
  check-cycles:
    name: Check circular imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run check_cycles.py
        run: python scripts/check_cycles.py

  # ===========================================================================
  # 0b. Ruff lint (Ubuntu только, Python 3.12) — CI-1
  # ===========================================================================
  # Запускается после check-cycles, ~10 секунд. Падает, если в коде есть
  # style-нарушения (unused imports, bare except, type comparisons, и т.д.).
  # Конфиг в pyproject.toml [tool.ruff].
  #
  # mypy запускается как warn-only (continue-on-error: true) — он не блокирует
  # PR, но сообщает о проблемах с типами. Когда QUA-7 (95% типизация) будет
  # закрыт, можно сделать mypy блокирующим.
  lint:
    name: Ruff + mypy
    runs-on: ubuntu-latest
    needs: [check-cycles]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff and mypy
        run: pip install ruff mypy

      - name: Ruff check (blocking)
        run: ruff check .

      - name: Ruff format check (non-blocking for now)
        # ruff format wants to reformat ~105 files. Making this blocking
        # would force a one-shot reformat of the entire codebase, which
        # is a separate task (QUA-4 follow-up). For now: warn-only.
        continue-on-error: true
        run: ruff format --check .

      - name: mypy (non-blocking, warn-only)
        continue-on-error: true
        run: mypy senpy/ --warn-unreachable --no-error-summary || true

  # ===========================================================================
  # 1. Matrix-тесты: Python × OS
  # ===========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check-cycles]  # не запускаем тесты, если найдены циклы
    strategy:
      fail-fast: false  # прогоняем все комбинации, даже если одна упала
      matrix:
        # Полный matrix: Ubuntu + Windows × Python 3.11/3.12/3.13 (6 комбинаций)
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
        # macOS только Python 3.12 — safety net для контрибьюторов на macOS.
        # macOS-пользователи Ren'Py — редкость, но Senpy запускают и сами
        # разработчики Senpy на macOS. Эта 1 добавочная job ловит macOS-specific
        # баги (path separators, case-sensitivity FS, framework Python).
        include:
          - os: macos-latest
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests with coverage
        # Coverage gate. --cov-fail-under=75 — мягкий порог:
        # текущий coverage ~77% без vendor (см. pyproject.toml omit).
        # Если упадёт ниже 75% — это сигнал, что что-то сломалось.
        # Поднимем до 80% после закрытия (типизация до 95%+).
        run: pytest tests/ --cov=senpy --cov-fail-under=75 --tb=short

      - name: Upload coverage (Ubuntu + Python 3.12 only)
        # Upload to codecov.io — для public repos tokenless upload работает
        # из коробки (codecov-action v4 + GitHub OIDC). Если у вас private fork,
        # добавьте секрет CODECOV_TOKEN и раскомментируйте token: ниже.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./.coverage
          disable_search: true  # не искать coverage файлы по всему репо
          fail_ci_if_error: false  # не падать CI, если codecov недоступен
          # token: ${{ secrets.CODECOV_TOKEN }}  # раскомментировать для private repo

  # ===========================================================================
  # 3. Sanity check: wheel собирается (только на main/develop)
  # ===========================================================================
  build-check:
    name: Build check (wheel)
    runs-on: ubuntu-latest
    needs: [check-cycles]  # не запускаем build, если найдены циклы
    # Только на main/develop — не тратим минуты на feature-ветках
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload wheel artifact (для возможной отладки)
        uses: actions/upload-artifact@v4
        with:
          name: senpy-wheel-check
          path: dist/*
          retention-days: 7  # храним артефакт 7 дней, потом удаляем

  # ===========================================================================
  # 4. Update dynamic badges (только на main после успешного test)
  # ===========================================================================
  # После прогона всех matrix-тестов на main — обновляем .github/badges/tests.json
  # и коммитим обратно в репо. README.md / README_ru.md читают этот JSON через
  # shields.io endpoint?url=... — бейдж всегда показывает актуальное число
  # тестов без ручной правки README.
  #
  # Запускается ТОЛЬКО:
  #   - на push в main (не на PR, не на feature-ветках)
  #   - после успешного test job (needs: [test])
  #   - не запускается на badge-коммите [skip ci] — иначе цикл
  #
  # Permissions: contents: write на уровне job (глобальный permission
  # вверху файла = contents: read — мы повышаем только для этого job'а).
  update-badges:
    name: Update dynamic badges
    runs-on: ubuntu-latest
    needs: [test, build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Senpy
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Update all badges (tests + rules + LSP + coverage + speed)
        run: python scripts/update_badges.py --run

      - name: Commit badge updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(badge): update dynamic badges [skip ci]"
          file_pattern: ".github/badges/*.json"
          commit_options: "--no-verify"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
