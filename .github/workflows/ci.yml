# =============================================================================
# Senpy CI — тесты и линтинг на каждый push и PR
# =============================================================================
# Триггеры:
#   - push в main или develop
#   - pull request в main или develop
#   - push в любую feature/* или refactor/* ветку (только быстрые тесты)
#
# Что делает:
#   1. Matrix-тесты: Python 3.11/3.12/3.13 × Ubuntu/Windows + macOS (3.12)
#   2. Pytest с coverage (gate: --cov-fail-under=80)
#
# НЕ делает:
#   - Сборку wheel/VSIX (это в release.yml)
#   - Публикацию на PyPI (это в release.yml)
#   - Создание GitHub Release (это в release.yml)
#
# Что делает (lint job, CI-1):
#   - Ruff check (blocking) — style-нарушения падают CI
#   - Ruff format --check (blocking) — неправильное форматирование падает CI
#   - mypy (non-blocking, warn-only) — сообщения о типах, не блокирует PR
# =============================================================================
name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'refactor/**'
      - 'feature/**'
    paths-ignore:
      - '.github/badges/*.json'
  pull_request:
    branches:
      - main
      - master
      - develop

# Отменяем старые запуски той же ветки при новом push — экономит минуты CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 0. Быстрая проверка циклических импортов (Ubuntu только, Python 3.12)
  # ===========================================================================
  # Фаза 1.7 (0.5.3): safety net для архитектуры. Если кто-то случайно
  # создаст новый цикл (analyzer ↔ X) — этот job упадёт ДО matrix-тестов.
  # Запускается первым, ~5 секунд.
  check-cycles:
    name: Check circular imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run check_cycles.py
        run: python scripts/check_cycles.py

  # ===========================================================================
  # 0b. Ruff lint (Ubuntu только, Python 3.12) — CI-1
  # ===========================================================================
  # Запускается после check-cycles, ~10 секунд. Падает, если в коде есть
  # style-нарушения (unused imports, bare except, type comparisons, и т.д.).
  # Конфиг в pyproject.toml [tool.ruff].
  #
  # mypy запускается как warn-only (continue-on-error: true) — он не блокирует
  # PR, но сообщает о проблемах с типами. Когда QUA-7 (95% типизация) будет
  # закрыт, можно сделать mypy блокирующим.
  lint:
    name: Ruff + mypy + Rule count sync
    runs-on: ubuntu-latest
    needs: [check-cycles]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff and mypy
        run: pip install ruff mypy

      - name: Install Senpy (for sync_rule_count.py)
        run: pip install -e .

      - name: Ruff check (blocking)
        run: ruff check .

      - name: Rule count sync check (blocking)
        # Verifies that all documentation files have the correct rule count
        # (matching RULES_DATABASE). If a new rule was added but docs were not
        # updated, this fails. Run `python scripts/sync_rule_count.py` to fix.
        run: python scripts/sync_rule_count.py --check

      - name: Ruff format check (non-blocking for now)
        # ruff format wants to reformat ~105 files. Making this blocking
        # would force a one-shot reformat of the entire codebase, which
        # is a separate task (QUA-4 follow-up). For now: warn-only.
        continue-on-error: true
        run: ruff format --check .

      - name: mypy (non-blocking, warn-only)
        continue-on-error: true
        run: mypy senpy/ --warn-unreachable --no-error-summary || true

  # ===========================================================================
  # 1. Matrix-тесты: Python × OS
  # ===========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check-cycles]  # не запускаем тесты, если найдены циклы
    strategy:
      fail-fast: false  # прогоняем все комбинации, даже если одна упала
      matrix:
        # Полный matrix: Ubuntu + Windows × Python 3.11/3.12/3.13 (6 комбинаций)
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, windows-latest]
        # macOS × Python 3.11/3.12/3.13 (3 комбинации).
        # macOS-пользователи Ren'Py — редкость, но Senpy запускают и сами
        # разработчики Senpy на macOS. Эти 3 добавочных job ловят macOS-specific
        # баги (path separators, case-sensitivity FS, framework Python).
        include:
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
          # Python 3.14 (beta) — experimental, non-blocking.
          # 3.14 is in beta until Oct 2026. Dependencies (pydantic, pygls)
          # may not fully support it yet. continue-on-error below ensures
          # failures don't block PRs. When 3.14 goes stable, remove the flag.
          - os: ubuntu-latest
            python-version: '3.14'
            experimental: true
          - os: windows-latest
            python-version: '3.14'
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          allow-prereleases: ${{ matrix.experimental || false }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests with coverage
        # Coverage gate. --cov-fail-under=80 — повышен с 75% после
        # WL-609. Фактический coverage ~82% без vendor.
        # Если упадёт ниже 80% — это сигнал, что что-то сломалось.
        # Поднимем до 80% после закрытия (типизация до 95%+).
        #
        # Python 3.14 (experimental) — continue-on-error: не блокирует PR.
        # 3.14 beta может ломать deps (pydantic C extensions, pygls).
        # Когда 3.14 stable — убрать continue-on-error.
        continue-on-error: ${{ matrix.experimental || false }}
        run: pytest tests/ --cov=senpy --cov-fail-under=80 --tb=short

      - name: Upload coverage (Ubuntu + Python 3.12 only)
        # Upload to codecov.io — для public repos tokenless upload работает
        # из коробки (codecov-action v4 + GitHub OIDC). Если у вас private fork,
        # добавьте секрет CODECOV_TOKEN и раскомментируйте token: ниже.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./.coverage
          disable_search: true  # не искать coverage файлы по всему репо
          fail_ci_if_error: false  # не падать CI, если codecov недоступен
          # token: ${{ secrets.CODECOV_TOKEN }}  # раскомментировать для private repo

  # ===========================================================================
  # 3. Sanity check: wheel собирается (только на main/develop)
  # ===========================================================================
  build-check:
    name: Build check (wheel)
    runs-on: ubuntu-latest
    needs: [check-cycles]  # не запускаем build, если найдены циклы
    # Только на main/develop — не тратим минуты на feature-ветках
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload wheel artifact (для возможной отладки)
        uses: actions/upload-artifact@v4
        with:
          name: senpy-wheel-check
          path: dist/*
          retention-days: 7  # храним артефакт 7 дней, потом удаляем

  # ===========================================================================
  # 4. Plugin smoke test — load examples/my_senpy_plugin and verify Senpy
  #    sees its custom rule (RPY901). Catches plugin API regressions.
  # ===========================================================================
  plugin-smoke:
    name: Plugin smoke test
    runs-on: ubuntu-latest
    needs: [check-cycles]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Senpy
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install example plugin
        run: pip install -e examples/my_senpy_plugin

      - name: Trust the plugin (non-interactive)
        run: senpy --trust-plugin my-senpy-plugin

      - name: Verify plugin rule is visible
        # senpy rule list must include RPY901 (the plugin's custom rule).
        # If it's missing, the plugin API is broken.
        run: |
          senpy rule list --format json > /tmp/rules.json
          python -c "
          import json, sys
          rules = json.load(open('/tmp/rules.json'))
          codes = {r['code'] for r in rules}
          if 'RPY901' not in codes:
              print('FAIL: RPY901 (plugin rule) not found in senpy rule list')
              print('Available codes:', sorted(codes))
              sys.exit(1)
          print('OK: RPY901 is visible')
          "

      - name: Run Senpy with plugin on test_game
        # The plugin should NOT crash Senpy when analyzing a real project.
        # Exit code 0 or 1 (errors found) is OK; exit code 2 (crash) is not.
        run: senpy test_game/ --exit-zero || true

  # ===========================================================================
  # 5. Update badges — после прогона всех matrix-тестов на main
  # ===========================================================================
  # README.md / README_ru.md читают badges JSON через shields.io
  # endpoint?url=... — бейдж всегда показывает актуальное число
  # тестов без ручной правки README.
  #
  # Запускается ВСЕГДА при push в main — даже если matrix-тесты упали.
  # Это правильно: если тесты упали, badge должен показать red, а не
  # оставаться stale-green от прошлого коммита. Используем `always()`
  # чтобы обойти дефолтный GitHub behavior (не запускать downstream
  # jobs если upstream failed).
  #
  # Запускается ТОЛЬКО:
  #   - на push в main (не на PR, не на feature-ветках)
  #   - после test job (needs: [test, build-check] — ждёт завершения, но не его успеха)
  #
  # Badges больше НЕ коммитятся обратно в main — раньше git-auto-commit
  # делал `chore(badge): update dynamic badges [skip ci]` в main, что
  # порождало merge commits при гонке с push'ами. Теперь
  # CI пушит badge JSON в отдельный GitHub Gist через API — main не
  # трогается, race condition исчезает. README ссылается на
  # `https://gist.githubusercontent.com/<user>/<GIST_ID>/raw/<file>.json`.
  #
  # Permissions: contents: read — main не мутируется, gist-обновление
  # идёт через PAT (GIST_TOKEN), а не через GITHUB_TOKEN.
  update-badges:
    name: Update dynamic badges
    runs-on: ubuntu-latest
    needs: [test, build-check]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Senpy
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Update all badges (tests + rules + LSP + coverage + speed)
        run: python scripts/update_badges.py --run

      - name: Push badges to GitHub Gist
        # Replaces the old "git-auto-commit back to main" step that caused
        # merge conflicts with the maintainer's pushes. The gist is a
        # separate storage area that CI updates via the GitHub API — it
        # never touches the `main` branch, so there is no race condition.
        #
        # Requires two repo secrets:
        #   GIST_TOKEN — a classic Personal Access Token with the `gist` scope
        #                (the Actions-provided GITHUB_TOKEN does NOT work).
        #   GIST_ID    — the gist ID from the gist's URL
        #                (https://gist.github.com/<user>/<GIST_ID>).
        # The gist must be PUBLIC so shields.io can read the raw JSON.
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python scripts/push_badges_to_gist.py
