# =============================================================================
# Senpy CI — тесты на push и PR
# =============================================================================
# Matrix: Python 3.11/3.12/3.13 × Ubuntu/Windows
# Включает: pytest + Ruff lint + Coverage + Wheel build
# VSIX build — отдельный job (требует Node.js, не зависит от Python matrix)
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Отменяем старые запуски того же PR/branch при новом push — экономит минуты
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write  # для pytest-annotation

jobs:
  # ===========================================================================
  # Тесты на matrix Python × OS
  # ===========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true  # если одна задача падает — остальные отменяются
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # shell: bash — явно указываем bash для кроссплатформенности (на Windows
        # default shell = powershell, что ломает unix-синтаксис типа 2>/dev/null).
        # GitHub Actions предоставляет bash на всех ОС через Git Bash на Windows.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install -e .
          pip install pytest pytest-cov coverage[toml]

      - name: Run tests with coverage
        # coverage run -m pytest — запускает тесты с покрытием.
        # --cov-report=xml — генерирует coverage.xml для Codecov.
        run: |
          coverage run -m pytest tests/ -v
          coverage xml
          coverage report

      - name: Upload coverage to Codecov
        # Только на Ubuntu (на Windows coverage.xml может отличаться).
        # На главной версии Python (3.12) — чтобы не дублировать загрузки.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false  # не блокируем CI, если Codecov упал
          verbose: true

  # ===========================================================================
  # Ruff lint + format check — один job, не зависит от matrix
  # ===========================================================================
  lint:
    name: Ruff lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check (lint)
        # Проверяет линтером: unused imports, undefined names, etc.
        run: ruff check .

      - name: Ruff format --check
        # Проверяет, что код отформатирован по нашим правилам.
        # --check = не переписывать, только проверить, exit 1 если diff.
        run: ruff format --check .

  # ===========================================================================
  # Wheel build — проверка packaging
  # ===========================================================================
  build-wheel:
    name: Build wheel + verify install
    runs-on: ubuntu-latest
    needs: [test]  # запускаем только если тесты прошли
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distribution metadata
        # twine check ловит: missing README, broken classifiers, и т.д.
        run: twine check dist/*

      - name: Verify install in clean venv
        # Берём свежий wheel, ставим в чистый venv, проверяем import.
        run: |
          python -m venv /tmp/test_venv
          /tmp/test_venv/bin/pip install --no-cache-dir dist/*.whl
          /tmp/test_venv/bin/python -c "from senpy.__version__ import __version__; print(f'senpy {__version__} installed OK')"

      - name: Upload wheel artifact
        # Артефакт доступен для скачивания из Actions UI + для release job.
        uses: actions/upload-artifact@v4
        with:
          name: senpy-wheel
          path: dist/*
          retention-days: 14

  # ===========================================================================
  # VSIX build — сборка VS Code extension
  # ===========================================================================
  build-vsix:
    name: Build VS Code extension (.vsix)
    runs-on: ubuntu-latest
    needs: [test]  # запускаем только если тесты прошли
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: senpy-vscode/package-lock.json

      - name: Install VS Code extension dependencies
        working-directory: senpy-vscode
        run: npm ci || npm install

      - name: Compile extension (esbuild)
        working-directory: senpy-vscode
        run: npm run compile

      - name: Install vsce (packaging tool)
        run: npm install -g @vscode/vsce

      - name: Package VSIX
        working-directory: senpy-vscode
        run: vsce package --no-yarn --no-git-tag-version

      - name: Verify VSIX metadata
        # Проверяем, что .vsix создался и имеет разумный размер
        working-directory: senpy-vscode
        run: |
          ls -la *.vsix
          # VSIX должен быть больше 1KB (иначе пустой) и меньше 200MB (иначе лишнее)
          SIZE=$(stat -c%s *.vsix 2>/dev/null || stat -f%z *.vsix)
          echo "VSIX size: $SIZE bytes"
          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: VSIX слишком маленький ($SIZE bytes)"
            exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: senpy-vsix
          path: senpy-vscode/*.vsix
          retention-days: 14
