# Build and deploy the Senpy documentation site to GitHub Pages.
#
# Triggers:
#   - push to main (only if docs/, mkdocs.yml, requirements-docs.txt changed)
#   - manual dispatch
#
# Output: https://xilleet.github.io/senpy/
#
# The site is built with MkDocs Material (same as Ruff, FastAPI, Pydantic,
# Typer) and published to the gh-pages branch. The branch is force-pushed
# on every successful build, so it only ever contains the latest site.
#
# Permissions: contents:write is required for the gh-pages push.

name: Build & deploy docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # manual run from Actions tab

# Cancel a previous run of the same workflow on the same ref — saves CI
# minutes when pushing many small doc fixes in a row.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history — needed for mike versioning later

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs + Material
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: senpy-docs-site
          path: site/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: senpy-docs-site
          path: site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
