# Build and deploy the Senpy documentation site to GitHub Pages.
#
# Triggers:
#   - push to main (only if docs/, mkdocs.yml, requirements-docs.txt changed)
#   - manual dispatch
#
# Output: https://xilleet.github.io/senpy/
#
# The site is built with MkDocs Material (same as Ruff, FastAPI, Pydantic,
# Typer) and published directly to GitHub Pages via the official
# actions/upload-pages-artifact + actions/deploy-pages pair.
#
# Single-job design (0.9.3 hotfix): the original 2-job design (build →
# upload-artifact → download-artifact → upload-pages-artifact → deploy)
# failed intermittently with "No artifacts named 'github-pages' were
# found for this workflow run" — see actions/deploy-pages#305 and the
# Oct 2026 intermittent-lookup thread. The cross-job artifact dance
# also required actions/upload-artifact@v7 + actions/download-artifact@v8
# to be in sync (download-artifact@v8 is not a stable release on
# github.com — latest stable is v4 as of Oct 2026).
#
# Folding build + deploy into one job eliminates both the version
# mismatch and the cross-job artifact lookup race: the Pages artifact
# (`github-pages`) is produced and consumed in the same workflow run,
# same job, with no intermediate `senpy-docs-site` transfer.
#
# Permissions: pages:write + id-token:write are required by
# actions/deploy-pages (the official GitHub Pages deploy action).

name: Build & deploy docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # manual run from Actions tab

# Cancel a previous run of the same workflow on the same ref — saves CI
# minutes when pushing many small doc fixes in a row.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # read the repo to build docs (no gh-pages branch push — Pages deploys via the API)
  pages: write     # deploy-pages needs this to publish the Pages site
  id-token: write  # deploy-pages uses OIDC for authentication

jobs:
  build-and-deploy:
    name: Build MkDocs site + deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history — needed for mike versioning later

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs + Material
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build site
        # --strict aborts on any broken link / missing nav entry / orphan
        # page. If this step fails, the deploy steps below do not run —
        # no partial site is ever published.
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        # Sets the Pages metadata (page_url output for the environment
        # url field above). Required before upload-pages-artifact.
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        # Bundles site/ into the canonical `github-pages` artifact that
        # deploy-pages@v5 expects. The artifact lives in the current
        # workflow run — same job, no cross-job transfer.
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
