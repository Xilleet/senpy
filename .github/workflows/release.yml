# =============================================================================
# Senpy Release — публикация релиза по тегу vX.Y.Z
# =============================================================================
# Триггер: push тега v*.*.* (например, v0.5.2, v0.6.0, v1.0.0)
#
# Что делает (5 jobs, последовательно):
#   1. test           — pytest (pre-release проверка)
#   2. build          — собирает wheel + sdist, проверяет версию vs тег
#   3. build-vsix     — собирает автономный VSIX со встроенным senpy.exe
#   4. publish-pypi   — публикует wheel на PyPI (через API token или OIDC)
#   5. github-release — создаёт GitHub Release с wheel + VSIX
#
# НАСТРОЙКА (one-time):
#   1. PyPI API token: https://pypi.org/manage/account/token/
#      - Add API token → Scope: "Entire account" или "Project: senpy-linter"
#      - Скопируйте token (начинается с pypi-)
#
#   2. GitHub Secret:
#      - Repository → Settings → Secrets and variables → Actions
#      - New repository secret:
#        Name:  PYPI_API_TOKEN
#        Value: pypi-XXXXXXXX...
#
#   После этого публикация будет автоматической при git push origin v0.5.2.
#
# Альтернатива (Trusted Publishing/OIDC, без токена):
#   См. комментарии в publish-pypi job ниже. Сложнее настроить, но безопаснее.
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      # v0.5.2, v1.0.0, v2.3.1 — SemVer
      # v0.6.0-rc1 → будет помечен как prerelease (см. ниже)

# Release нельзя отменять — даже если запушили новый тег, старый должен дойти
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # для создания GitHub Release
  id-token: write   # для PyPI Trusted Publishing (если используете OIDC вместо API token)

jobs:
  # ===========================================================================
  # 1. Pre-release тесты — релизим только зелёное
  # ===========================================================================
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: pytest tests/ -v

  # ===========================================================================
  # 2. Сборка wheel + sdist
  # ===========================================================================
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Verify version matches tag
        # Защита от опечаток: базовая версия тега должна совпадать с __version__.py
        # Разрешаем суффиксы (-rc1, -beta) и на теге, и в package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "from senpy.__version__ import __version__; print(__version__)")
          TAG_BASE=$(echo "$TAG_VERSION" | cut -d'-' -f1)
          PKG_BASE=$(echo "$PKG_VERSION" | cut -d'-' -f1)
          echo "Git tag version:   $TAG_VERSION (base: $TAG_BASE)"
          echo "Package version:   $PKG_VERSION (base: $PKG_BASE)"
          if [ "$TAG_BASE" != "$PKG_BASE" ]; then
            echo ""
            echo "ERROR: Base tag version ($TAG_BASE) != package version ($PKG_BASE)"
            echo "Run: python bump_version.py patch  (or minor/major)"
            exit 1
          fi
          echo "OK: Versions match ($PKG_BASE)"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: senpy-dist
          path: dist/*

  # ===========================================================================
  # 3. Сборка автономного VSIX (Windows, со встроенным senpy.exe)
  # ===========================================================================
  build-vsix:
    name: Build autonomous VSIX
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      # --- Шаг 1: PyInstaller — сборка senpy.exe ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Senpy + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build senpy.exe with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name senpy \
            --paths . \
            --distpath "senpy-vscode/bin" \
            --workpath "build" \
            --specpath "build" \
            "senpy/cli/main.py"

      - name: Verify senpy.exe
        shell: bash
        run: |
          ls -la "senpy-vscode/bin/senpy.exe"
          "senpy-vscode/bin/senpy.exe" --version

      # --- Шаг 2: Node.js — сборка TypeScript extension ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: senpy-vscode/package-lock.json

      - name: Install npm dependencies
        working-directory: senpy-vscode
        shell: bash
        run: npm ci || npm install

      - name: Compile extension (esbuild)
        working-directory: senpy-vscode
        run: npm run compile

      # --- Шаг 3: vsce package — сборка VSIX ---
      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package VSIX
        working-directory: senpy-vscode
        shell: bash
        run: vsce package --no-yarn --no-git-tag-version

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: senpy-vsix
          path: senpy-vscode/*.vsix

  # ===========================================================================
  # 4. Публикация на PyPI
  # ===========================================================================
  # ДВА ВАРИАНТА настройки (выберите один):
  #
  # ВАРИАНТ A (проще, через API token):
  #   1. Получите API token: https://pypi.org/manage/account/token/
  #   2. Добавьте GitHub Secret: PYPI_API_TOKEN
  #   3. Раскомментируйте строки "password:" ниже
  #   4. Можно удалить `environment: pypi` и `id-token: write` (если не используете OIDC)
  #
  # ВАРИАНТ B (безопаснее, через Trusted Publishing/OIDC — без токена):
  #   1. Настройте на PyPI: https://pypi.org/manage/account/publishing/
  #      → Add publisher → GitHub → заполнить форму
  #        (Owner: Xilleet, Repo: senpy, Workflow: release.yml, Environment: pypi)
  #   2. Создайте GitHub Environment с именем "pypi"
  #   3. Ничего не раскомментируйте — OIDC работает автоматически
  #
  # Сейчас настроен ВАРИАНТ B (OIDC). Если не работает — переключитесь на A.
  # ===========================================================================
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi  # нужно для Trusted Publishing (ВАРИАНТ B)
    # Если используете ВАРИАНТ A (API token) — environment можно убрать

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: senpy-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # ВАРИАНТ A (API token) — раскомментируйте 2 строки ниже:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

        # ВАРИАНТ B (OIDC/Trusted Publishing) — ничего не указываем,
        # OIDC работает автоматически через `id-token: write` permission выше.

  # ===========================================================================
  # 5. GitHub Release с артефактами
  # ===========================================================================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, build-vsix]  # ждём и PyPI, и VSIX
    # Если publish-pypi отключён (if: false) — заменить на:
    # needs: [build-vsix]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release/
          find release-assets/ -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "*.vsix" \) -exec cp {} release/ \;
          echo "=== Files to upload ==="
          ls -la release/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Senpy v${{ steps.version.outputs.version }}
          # GitHub сам собирает release notes из commits между тегами
          # Группирует по Conventional Commits (feat:, fix:, docs:, chore:)
          generate_release_notes: true
          draft: false
          # Если тег содержит '-' (v0.6.0-rc1) → помечаем как prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*.whl
            release/*.tar.gz
            release/*.vsix
