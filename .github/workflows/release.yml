# =============================================================================
# Senpy Release — публикация на PyPI по тегу vX.Y.Z
# =============================================================================
# push тегов вида v*.*.*

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  
  id-token: write  

jobs:

  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -e .[dev] 2>/dev/null || pip install -e .
          pip install pytest
          pytest tests/ -v

  # ===========================================================================
  # wheel + sdist
  # ===========================================================================
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Verify version matches tag

        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "from senpy.__version__ import __version__; print(__version__)")
          echo "Git tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) != package version ($PKG_VERSION)"
            echo "Обнови senpy/__version__.py через 'python bump_version.py' перед созданием тега."
            exit 1
          fi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: senpy-dist
          path: dist/*

  # ===========================================================================
  # Публикация на PyPI через Trusted Publishing (OIDC)
  # ===========================================================================
  # НАСТРОЙКА ONE-TIME (на стороне PyPI):
  # 1. Зайди на https://pypi.org/manage/account/publishing/
  # 2. Add a new publisher → GitHub
  #    - PyPI Project Name: senpy-linter
  #    - Owner: Xilleet
  #    - Repository: senpy
  #    - Workflow filename: release.yml
  #    - Environment name: pypi (должно совпадать с environment: ниже)
  # После этого публикация будет автоматической, без токенов.
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi  # обязателен для Trusted Publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: senpy-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Никаких токенов — PyPI Trusted Publishing через OIDC.
        # with: password: ... — НЕ НУЖНО, OIDC работает автоматически.

  # ===========================================================================
  # Сборка VSIX для GitHub Release
  # ===========================================================================
  build-vsix:
    name: Build VSIX for release
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: senpy-vscode/package-lock.json

      - name: Install + compile + package VSIX
        working-directory: senpy-vscode
        run: |
          npm ci 2>/dev/null || npm install
          npm run compile
          npm install -g @vscode/vsce
          vsce package --no-yarn --no-git-tag-version

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: senpy-vsix-release
          path: senpy-vscode/*.vsix

  # ===========================================================================
  # GitHub Release с артефактами
  # ===========================================================================
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi, build-vsix]
    permissions:
      contents: write  # для создания release
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Prepare release assets
        # Складываем всё в одну папку для upload
        run: |
          mkdir -p release/
          find release-assets/ -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "*.vsix" \) -exec cp {} release/ \;
          ls -la release/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Senpy v${{ steps.version.outputs.version }}
          generate_release_notes: true  # авто-генерация из commit messages
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v0.4.8-rc1 → prerelease
          files: |
            release/*.whl
            release/*.tar.gz
            release/*.vsix
