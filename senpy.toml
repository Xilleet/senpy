[tool.senpy]
# -----------------------------------------------------------------------------
# НАСТРОЙКИ СКАНИРОВАНИЯ
# -----------------------------------------------------------------------------

# Автоматически декомпилировать скомпилированные .rpyc во временную песочницу
# без лишних подтверждений в консоли (рекомендуется true)
decompile = true

# Максимальное количество ошибок для отрисовки в терминале (по умолчанию 50)
max_errors = 50

# Пользовательский путь к unrpyc (раскомментируйте, если хотите зафиксировать путь)
# unrpyc_path = "D:/tools/unrpyc.py"


# -----------------------------------------------------------------------------
# ИГНОРИРОВАНИЕ ПРАВИЛ
# -----------------------------------------------------------------------------
# Добавьте сюда коды правил, которые не актуальны для вашего стиля разработки.
ignore = [
    # "RPY104",  # Отключить предупреждения о создании переменных на лету ($ var = ...)
    # "RPY303",  # Отключить поиск "мертвых" меток (актуально, если в игре динамический роутер)
]


# =============================================================================
# ШПАРГАЛКА ПО КОДАМ ОШИБОК SENPY:
# =============================================================================
#  RPY101 - Опечатка/необъявленная переменная в подстановке диалога [var]
#  RPY102 - Операция накопления ($ var += 1) до объявления в default (NameError)
#  RPY103 - Необъявленная переменная в условии (if var:)
#  RPY104 - Создание переменной через $ без default (ломает сохранения Save/Load)
#
#  RPY201 - Прямая мутация переменной внутри screen (ломает откат и предикшен)
#  RPY202 - Экран читает переменную, которой нет в default (краш до старта игры)
#
#  RPY301 - Незакрытые теги форматирования текста ({b}...{/b})
#  RPY302 - Прыжок (jump/call) на несуществующую метку label (ScriptError)
#  RPY303 - Мертвый код: метка объявлена, но на нее нигде нет ссылок
#  RPY304 - Битый цвет в теге {color=#...} (невалидный hex или имя)
#
#  RPY401 - Логическая дыра в menu: переменная создана не во всех ветках выбора
#  RPY501 - Аудиофайл (play music/sound) не найден на диске и в .rpa архивах
# =============================================================================